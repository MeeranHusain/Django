{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/account_css/login.css' %}">
</head>
<body>
    <h2 class="text-center pt-5">Login</h2>
    <form action="{% url 'login' %}" method="post" style="max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    
</body>
</html>
