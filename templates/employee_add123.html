{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="{% static 'css/employee_add.css' %}">
</head>

<body>
    <div class="form-container">
        <!-- Form Header -->
        <div class="form-header">
            <h1>Add Employee</h1>
            <p>Create a new employee record</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- =========================================
                 SECTION 1: PERSONAL INFORMATION
            ========================================== -->

            <div class="form-section">
                <div class="section-title">
                    <h2>Personal Information</h2>
                    <p>Enter basic employee information</p>
                </div>

                <div class="form-row">
                    <!-- First Name -->
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name"name="first_name" placeholder="Enter first name" required>
                    </div>

                    <!-- Last Name -->
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Enter last name" required >
                    </div>
                </div>


                <div class="form-row">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter email address" required>
                    </div>

                    <!-- Designation -->
                    <div class="form-group">
                        <label for="designation">Designation</label>
                        <input type="text" id="designation"name="designation" placeholder="Enter designation" required >
                    </div>
                </div>


                <!-- Employee Image -->
                <div class="form-group">
                    <label for="image">Employee Image</label>
                    <input type="file" id="image" name="image" accept="image/*" >
                    <small>Optional - Default image will be used if no image is selected.</small>
                </div>

            </div>


            <!-- =========================================
                 SECTION 2: EMPLOYMENT INFORMATION
            ========================================== -->

            <div class="form-section">

                <div class="section-title">
                    <h2>Employment Information</h2>
                    <p>Enter employee's job and company details</p>
                </div>


                <div class="form-row">
                    <!-- Salary -->
                    <div class="form-group">
                        <label for="salary">Salary</label>
                        <input type="number" id="salary" name="salary" placeholder="Enter salary" min="0" step="0.01" required>
                    </div>

                    <!-- Joining Date -->
                    <div class="form-group">
                        <label for="joining_date">Joining Date</label>
                        <input type="date" id="joining_date" name="joining_date" required>
                    </div>
                </div>


                <div class="form-row">
                    <!-- Department -->
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            {% for department in departments %}
                                <option value="{{ department.id }}">
                                    {{ department.dept_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>


                    <!-- Manager -->
                    <div class="form-group">
                        <label for="manager">Manager</label>
                        <select id="manager" name="manager">
                            <option value="">Select Manager</option>
                            {% for manager in managers %}
                                <option value="{{ manager.id }}">
                                    {{ manager.first_name }} {{ manager.last_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>


                <!-- Active Status -->
                <div class="checkbox-group">
                    <input type="checkbox" id="is_active" name="is_active" checked>
                    <label for="is_active">Active Employee</label>
                </div>
            </div>


            <!-- Form Actions -->
            <div class="form-actions">
                <a href="/" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn">Add Employee</button>
            </div>

        </form>
    </div>

</body>
</html>
