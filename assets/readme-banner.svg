<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Employee Management System</title>
  <desc id="desc">A modern purple, blue and cyan gradient banner for a Python Django employee management project.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="300" fill="#101827"/>
    <ellipse cx="170" cy="35" rx="390" ry="190" fill="url(#background)" filter="url(#softBlur)"/>
    <ellipse cx="1060" cy="270" rx="370" ry="190" fill="url(#pinkGlow)" filter="url(#softBlur)"/>
    <ellipse cx="600" cy="-20" rx="360" ry="120" fill="url(#cyanGlow)" filter="url(#softBlur)"/>

    <path d="M-30 224 C170 70 350 90 520 190 S860 280 1230 82" fill="none" stroke="#FFFFFF" stroke-opacity=".30" stroke-width="3"/>
    <path d="M-30 252 C170 98 350 118 520 218 S860 308 1230 110" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="2"/>
    <path d="M-30 196 C170 42 350 62 520 162 S860 252 1230 54" fill="none" stroke="#A5F3FC" stroke-opacity=".18" stroke-width="1.5"/>

    <g fill="#FFFFFF" opacity=".8">
      <circle cx="145" cy="95" r="3"/><circle cx="190" cy="130" r="2"/>
      <circle cx="1010" cy="70" r="3"/><circle cx="1060" cy="105" r="2"/>
      <circle cx="940" cy="220" r="2.5"/><circle cx="270" cy="225" r="2"/>
    </g>

    <text x="600" y="103" text-anchor="middle" fill="#E0F2FE"
          font-family="Arial, Helvetica, sans-serif" font-size="19"
          font-weight="600" letter-spacing="7">PYTHON  •  DJANGO  •  SQLITE</text>
    <text x="600" y="163" text-anchor="middle" fill="#FFFFFF"
          font-family="Arial, Helvetica, sans-serif" font-size="43"
          font-weight="700" letter-spacing="1">EMPLOYEE MANAGEMENT SYSTEM</text>
    <text x="600" y="207" text-anchor="middle" fill="#E0E7FF"
          font-family="Arial, Helvetica, sans-serif" font-size="17"
          font-weight="500" letter-spacing="4">MANAGE  •  ORGANIZE  •  SIMPLIFY</text>
  </g>
</svg>
